<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">

  <link rel="stylesheet" href="index.css">
  <title>Frontend Mentor | Product preview card component</title>
</head>

<body>
  <main>
    <div id="image">
      <img src="./assets/images/image-product-desktop.jpg" alt="Desktop Image">
      <img src="./assets/images/image-product-mobile.jpg" alt="Mobile Image">
    </div>
    <div id="descriptive_section">
      <p class="heading">Perfume</p>

      <p class="topic">Gabrielle Essence Eau De Parfum</p>

      <p class="description">A floral, solar and voluptuous interpretation composed by Olivier Polge,
        Perfumer-Creator for the House of CHANEL.</p>

      <div id="price_section">
        <p class="new_price">$149.99</p>
        <s class="old_price">$169.99</s>
      </div>

      <button type="submit">
        <img src="./assets/images/icon-cart.svg" alt="Cart Icon">
        Add to Cart
      </button>
    </div>
  </main>

  <footer class="attribution">
    Challenge by <a href="https://www.frontendmentor.io/challenges/product-preview-card-component-GO7UmttRfa">Frontend
      Mentor</a>.
    Coded by <a href="https://github.com/TDangerW">TDangerW</a>.
  </footer>
</body>

</html>
